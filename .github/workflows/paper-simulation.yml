name: MANU Paper Simulation
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: manu-paper-state
  cancel-in-progress: false
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read Binance public market data and update paper state
        run: python scheduled_paper.py
      - name: Save simulated state to repository
        run: |
          git config user.name "manu-paper-bot"
          git config user.email "manu-paper-bot@users.noreply.github.com"
          git add paper_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update simulated market state [skip ci]"
            git push
          fi
